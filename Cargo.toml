[package]
name = "brevlada"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
webkit6 = "0.6"
anyhow = "1"
async-channel = "2"
chrono = "0.4"
imap = "2.4"
native-tls = "0.2"
mailparse = "0.16"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[build-dependencies]
glib-build-tools = "0.22"
